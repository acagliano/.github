name: Personal Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # --- Auth ---
          token: ${{ secrets.METRICS_TOKEN }}
          user: acagliano  # replace with your personal GitHub username

          # --- Output ---
          filename: metrics.svg
          output_action: commit
          committer_message: "chore: update metrics [skip ci]"

          # --- Base ---
          # Only header; no activity, repos, or community stats
          base: header

          # --- Organizations ---
          plugin_organizations: yes

          # --- Featured repositories only ---
          plugin_repositories: yes
          plugin_repositories_featured: cagscalclabs/lwip-ce, cagscalclabs/cryptx
          plugin_repositories_pinned: 2

          # Disable everything else
          plugin_activity: no
          plugin_languages: no
          plugin_notable: no
          plugin_sponsors: no
